<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>N4 文法練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2622;--sub:#7a7066;--line:#e6ddcf;--accent:#c8442f;--accent-soft:#f6dcd5;--ok:#2f6f42;--ok-soft:#dcefe1;--ng:#b23a2b;--ng-soft:#f8dcd7;--chip:#efe7d9}
@media (prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#252220;--ink:#efe9e1;--sub:#a59b90;--line:#3a3531;--accent:#e2674f;--accent-soft:#4a2a24;--ok:#86cf9a;--ok-soft:#22372a;--ng:#f08a7a;--ng-soft:#46261f;--chip:#302c28}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans TC","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.jp{font-family:"Noto Sans JP","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:560px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:18px;font-weight:700}
header .meta{font-size:13px;color:var(--sub)}
main{max-width:560px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav .ic{font-family:"Noto Sans JP";font-size:19px;line-height:1.3;font-weight:500}
nav button.on{color:var(--accent);font-weight:700}
h2{font-size:17px;margin:2px 0 10px}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.big{font-family:"Noto Sans JP";font-size:34px;font-weight:700;text-align:center;line-height:1.3}
.reading{text-align:center;color:var(--sub);font-family:"Noto Sans JP"}
.ask{text-align:center;margin:8px 0 16px;font-size:15px}
.ask b{color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font:inherit;font-family:"Noto Sans JP";font-size:20px;color:var(--ink);min-height:62px;word-break:break-all}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopts .opt{font-size:17px;text-align:left;padding:11px 14px;min-height:0}
.qtext{font-family:"Noto Sans JP";font-size:19px;line-height:1.8;margin:4px 0 16px}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.ng{background:var(--ng-soft)}
.fb b{display:block;margin-bottom:2px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:13px;margin-top:12px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .pat{font-family:"Noto Sans JP";font-size:26px;font-weight:700;line-height:1.4}
.flash .mean{margin-top:14px;font-size:17px;font-weight:500}
.flash .ex{margin-top:10px;font-family:"Noto Sans JP";font-size:16px;color:var(--sub)}
.flash .hint{margin-top:18px;font-size:13px;color:var(--sub)}
.count{font-size:13px;color:var(--sub);text-align:right;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--chip);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--sub)}
.stat b{display:block;font-size:19px;color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.week h3{font-size:14px;margin:18px 0 8px;color:var(--sub);font-weight:500}
.day{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.done .t{color:var(--sub);text-decoration:line-through}
.day input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.day .t{flex:1;font-size:15px;line-height:1.4}
.day .d{font-size:12px;color:var(--sub);display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:var(--chip);border-radius:8px;font:inherit;font-size:13px;padding:4px 10px;color:var(--ink)}
.today-box .t{font-size:17px;font-weight:700;margin:2px 0 4px}
.wq{border-top:1px solid var(--line);padding:12px 0}
.wq:first-of-type{border-top:0}
.wq .s{font-family:"Noto Sans JP";font-size:16px}
.wq .a{font-size:14px;margin-top:4px}
.wq .a span{font-family:"Noto Sans JP";color:var(--ok);font-weight:700}
input[type=date]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);color:var(--ink)}
.exam{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:14px}
.cd{font-size:15px;font-weight:700;color:var(--accent)}
.req{font-size:15px;padding:2px 0;color:var(--ink)}
.req.ok{color:var(--ok);font-weight:700}
.msg{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:700;font-size:15px}
.link{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;padding:8px 0}
</style>
</head>
<body>
<header><div class="in"><h1>N4 文法練習</h1><span class="meta" id="hmeta"></span></div></header>
<main id="app"></main>
<nav><div class="in" id="nav"></div></nav>
<noscript>請開啟 JavaScript 才能使用。</noscript>
<script>
/* ========== 資料：動詞 ========== */
const VERBS=[
['書く','かく',1],['行く','いく',1],['聞く','きく',1],['歩く','あるく',1],['泳ぐ','およぐ',1],['急ぐ','いそぐ',1],
['話す','はなす',1],['貸す','かす',1],['出す','だす',1],['待つ','まつ',1],['持つ','もつ',1],['立つ','たつ',1],
['死ぬ','しぬ',1],['遊ぶ','あそぶ',1],['呼ぶ','よぶ',1],['読む','よむ',1],['飲む','のむ',1],['休む','やすむ',1],
['買う','かう',1],['会う','あう',1],['使う','つかう',1],['洗う','あらう',1],['作る','つくる',1],['乗る','のる',1],
['取る','とる',1],['帰る','かえる',1],['入る','はいる',1],['走る','はしる',1],['知る','しる',1],['切る','きる',1],
['食べる','たべる',2],['見る','みる',2],['起きる','おきる',2],['寝る','ねる',2],['教える','おしえる',2],['着る','きる',2],
['出る','でる',2],['借りる','かりる',2],['開ける','あける',2],['忘れる','わすれる',2],['浴びる','あびる',2],['降りる','おりる',2],
['する','する',3],['来る','くる',3],['勉強する','べんきょうする',3],['運転する','うんてんする',3]
].map(([k,r,g])=>({k,r,g}));

const FORM={te:'て形',ta:'た形',nai:'ない形',masu:'ます形',vol:'意向形',pot:'可能形',pass:'受身形',caus:'使役形',cp:'使役受身形',ba:'ば形'};
const FORM_KEYS=Object.keys(FORM);
const ROW={'う':'わいえお','く':'かきけこ','ぐ':'がぎげご','す':'さしせそ','つ':'たちてと','ぬ':'なにねの','ぶ':'ばびべぼ','む':'まみめも','る':'らりれろ'};
const ICH={te:'て',ta:'た',nai:'ない',masu:'ます',vol:'よう',pot:'られる',pass:'られる',caus:'させる',cp:'させられる',ba:'れば'};
const SURU={te:'して',ta:'した',nai:'しない',masu:'します',vol:'しよう',pot:'できる',pass:'される',caus:'させる',cp:'させられる',ba:'すれば'};
const KURU={te:'きて',ta:'きた',nai:'こない',masu:'きます',vol:'こよう',pot:'こられる',pass:'こられる',caus:'こさせる',cp:'こさせられる',ba:'くれば'};

function teForm(r,ta){
  const l=r.slice(-1),s=r.slice(0,-1);
  let x;
  if(r==='いく')x='って';
  else if('うつる'.includes(l))x='って';
  else if('むぶぬ'.includes(l))x='んで';
  else if(l==='く')x='いて';
  else if(l==='ぐ')x='いで';
  else x='して';
  if(ta)x=x.replace('て','た').replace('で','だ');
  return s+x;
}
function conj(v,f){
  const r=v.r;
  if(v.g===3){
    if(r==='くる')return KURU[f];
    return r.slice(0,-2)+SURU[f];
  }
  if(v.g===2)return r.slice(0,-1)+ICH[f];
  const l=r.slice(-1),s=r.slice(0,-1),w=ROW[l];
  switch(f){
    case 'te':return teForm(r,false);
    case 'ta':return teForm(r,true);
    case 'masu':return s+w[1]+'ます';
    case 'nai':return s+w[0]+'ない';
    case 'vol':return s+w[3]+'う';
    case 'pot':return s+w[2]+'る';
    case 'pass':return s+w[0]+'れる';
    case 'caus':return s+w[0]+'せる';
    case 'cp':return l==='す'?s+'させられる':s+w[0]+'される';
    case 'ba':return s+w[2]+'ば';
  }
}
function wrongs(v,f){
  const r=v.r,mist=[],other=[];
  if(f==='te'||f==='ta'){
    const ta=f==='ta';
    const ends=ta?['った','んだ','いた','いだ','した']:['って','んで','いて','いで','して'];
    if(v.g===1){const s=r.slice(0,-1);ends.forEach(e=>mist.push(s+e));mist.push(s+ROW[r.slice(-1)][1]+(ta?'た':'て'));}
    else if(v.g===2){const s=r.slice(0,-1);mist.push(s+ends[0],s+ends[1],r+(ta?'た':'て'),s+'り'+(ta?'た':'て'));}
    else if(r==='くる'){mist.push(ta?'こた':'こて',ta?'くった':'くって',ta?'くた':'くて');}
    else{const p=r.slice(0,-2);mist.push(p+(ta?'すた':'すて'),p+(ta?'さた':'さて'),p+(ta?'しった':'しって'));}
  }else{
    if(v.g===1){
      const ms=r.slice(0,-1)+ROW[r.slice(-1)][1];
      if(f!=='masu')mist.push(ms+ICH[f]);
      if(r.endsWith('る'))mist.push(conj({...v,g:2},f));
    }else if(v.g===2){mist.push(conj({...v,g:1},f));}
    ['nai','vol','pot','pass','caus','cp','ba','masu'].forEach(x=>{if(x!==f)other.push(conj(v,x));});
  }
  if(other.length===0)['nai','masu','vol'].forEach(x=>other.push(conj(v,x)));
  return shuffle(mist).concat(shuffle(other));
}
const IE='いきぎしじちぢにひびぴみりえけげせぜてでねへべぺめれ';
function rule(v,f){
  if(v.g===3){
    const t=v.r==='くる'?KURU:SURU;
    const name=v.r==='くる'?'来る':'する';
    return '不規則動詞「'+name+'」要直接背：'+FORM_KEYS.map(k=>FORM[k].replace('形','')+' '+t[k]).join('・');
  }
  if(v.g===2)return '一段動詞：去掉「る」＋'+ICH[f]+(f==='pot'||f==='pass'?'（可能形和受身形長一樣）':'');
  const l=v.r.slice(-1);
  let s='五段動詞（'+l+' 結尾）：';
  const TE={'う':'う・つ・る → って','つ':'う・つ・る → って','る':'う・つ・る → って','む':'む・ぶ・ぬ → んで','ぶ':'む・ぶ・ぬ → んで','ぬ':'む・ぶ・ぬ → んで','く':'く → いて','ぐ':'ぐ → いで','す':'す → して'};
  const G={masu:'い段＋ます',nai:'あ段＋ない（う 結尾變 わ）',vol:'お段＋う',pot:'え段＋る',pass:'あ段＋れる',caus:'あ段＋せる',cp:(l==='す'?'す 結尾用 させられる':'あ段＋される（也可說 あ段＋せられる）'),ba:'え段＋ば'};
  if(f==='te'||f==='ta'){
    if(v.r==='いく')s+='行く 是例外 → 行って／行った';
    else{let t=TE[l];if(f==='ta')t=t.replace(/て/g,'た').replace(/で/g,'だ');s+=t;}
  }else s+=G[f];
  if(l==='る'&&IE.includes(v.r.slice(-2,-1)))s+='。※ 長得像一段動詞，其實是五段（例外，要記！）';
  return s;
}

/* ========== 資料：文法 ========== */
const GROUPS=[
{n:'助詞・數量限定',items:[
['Nと（いっしょに）','和 N 一起','友だちといっしょに映画を見ました。'],
['Nで','在（地點）／用（工具）／因為','バスで学校へ行きます。'],
['Nを','離開、經過（移動）','毎朝7時に家を出ます。'],
['N1からN2まで','從 N1 到 N2','9時から5時まで働きます。'],
['Nまで','持續到 N（動作一直做）','3時までここで待ちます。'],
['Nまでに','在 N 之前（期限，做一次）','3時までにレポートを出してください。'],
['Nだけ','只有（中性）','一つだけ買いました。'],
['Nしか～ない','只有（強調少，接否定）','100円しかありません。'],
['Nぐらい','大約；至少','駅まで10分ぐらいです。'],
['Nばかり','淨是、光是（帶不滿）','弟はゲームばかりしています。'],
['Nでも','…之類的（舉例建議）；連 N 都','お茶でも飲みませんか。'],
['Nも','也；竟多達（數量＋も）','ビールを5本も飲んだ。'],
['N1もN2も','N1 和 N2 都','肉も魚も好きです。'],
['N1やN2（など）','N1 和 N2 等（列舉部分）','机の上に本やペンなどがあります。'],
['N1とかN2（とか）','N1 啦 N2 啦（口語列舉）','休みはテニスとか水泳とかをします。'],
['N1かN2（か）','N1 或 N2','月曜日か火曜日に来てください。'],
['～か（～か）','是否…（句中疑問）','行くか行かないか、まだ決めていません。']]},
{n:'て形家族＋複合動詞',items:[
['Vている','正在做；狀態持續；習慣','窓が開いています。'],
['Vてある','（有人刻意）已經…好的狀態','窓が開けてあります。'],
['Vておく','事先做好；放著不動','旅行の前にホテルを予約しておきます。'],
['Vてしまう／Vちゃう','做完了；不小心…了（遺憾）','財布をなくしてしまった。'],
['Vてみる','試著做做看','このケーキ、食べてみてください。'],
['Vていく','（從現在）…下去；做了再去','これから寒くなっていきます。'],
['Vてくる','（到現在）…起來；去做了再回來','ちょっと飲み物を買ってきます。'],
['Vてから','做完 V 之後再…','手を洗ってから食べます。'],
['Vて（すぐに）','一…就馬上','家に帰って、すぐに寝ました。'],
['～て／Aくて／Naで','因為…（後接感情、無法控制的結果）','頭が痛くて、学校を休みました。'],
['Vないで','不做 V 而…；請不要…','朝ご飯を食べないで会社に行った。'],
['Vず（に）','不做 V 而…（＝ないで，書面）','辞書を使わずに読みました。'],
['Vはじめる','開始…','雨が降りはじめました。'],
['Vだす','突然開始…','赤ちゃんが急に泣きだした。'],
['Vつづける','持續…','3時間歩きつづけました。'],
['Vおわる','…完','この本はもう読みおわりました。']]},
{n:'授受表現',items:[
['あげる','我（或我方）給別人','私は妹に本をあげました。'],
['くれる','別人給我（或我方）','友だちが私に花をくれました。'],
['もらう','我從別人那裡得到','私は先生に辞書をもらいました。'],
['やる','給（動植物、晚輩）','花に水をやります。'],
['Vてあげる','為別人做','弟に宿題を教えてあげた。'],
['Vてくれる','別人為我做','母がセーターを編んでくれた。'],
['Vてもらう','請別人為我做（我得到恩惠）','友だちに写真を撮ってもらった。'],
['Vてやる','為晚輩／動物做','犬を散歩に連れていってやった。'],
['Vてさしあげる','為長輩做（謙讓）','先生の荷物を持ってさしあげました。'],
['Vてくださる','長輩為我做（尊敬）','先生が説明してくださいました。'],
['Vていただく','請長輩為我做（謙讓）','社長に書類を見ていただきました。'],
['Vてもらえませんか','能不能請你幫我…','ちょっと手伝ってもらえませんか。'],
['Vてくださいませんか','能不能請您…（更客氣）','もう一度言ってくださいませんか。'],
['Vていただけませんか','能否請您…（最客氣）','駅までの道を教えていただけませんか。']]},
{n:'許可・禁止・義務・建議',items:[
['Vてもいい','可以做','ここで写真を撮ってもいいですか。'],
['Vてもかまわない','做也沒關係（較正式）','鉛筆で書いてもかまいません。'],
['Nでもいい／Nでもかまわない','N 也可以','時間は午後でもいいです。'],
['Vなくてもいい','不做也可以','明日は来なくてもいいです。'],
['Vなくてもかまわない','不做也沒關係','全部食べなくてもかまいません。'],
['Nじゃなくてもいい／かまわない','不是 N 也可以','現金じゃなくてもいいですよ。'],
['Vてはいけない／Vちゃいけない','不可以做（禁止）','ここでタバコを吸ってはいけません。'],
['Vなければならない','必須做（義務、規定）','薬を飲まなければなりません。'],
['Vなくてはいけない','必須做（個人需要）','宿題をしなくてはいけない。'],
['Vないといけない','必須做（口語）','もう帰らないといけない。'],
['Vないと','不做不行（句尾省略）','急がないと。'],
['Vたほうがいい','最好做（建議）','早く寝たほうがいいですよ。'],
['Vないほうがいい','最好不要做','一人で行かないほうがいい。'],
['Vなさい','給我做（命令，對晚輩）','早く起きなさい。'],
['Vように言う','叫（某人）做','先生は私に毎日練習するように言いました。']]},
{n:'意志・願望・請求',items:[
['Vたい','想做','日本へ行きたいです。'],
['Vよう（意向形）','…吧（普通體邀約）','一緒に帰ろう。'],
['Vようと思う','打算做（剛決定、還在想）','来年、日本語の学校に入ろうと思っています。'],
['Vつもり','打算做（已決定的計畫）','夏休みに国へ帰るつもりです。'],

/* ========== 四週計畫 ========== */

const PLAN=[

{t:'書上模擬題（第二回）',wr:1},{t:'全部文法隨機測驗',g:0},{t:'不熟卡片清空',wr:1},
{t:'考前：易混淆對照掃一遍',g:13}]}
];
const DAYS=[];PLAN.forEach(w=>w.d.forEach(d=>DAYS.push(d)));

/* ========== 狀態 ========== */
const KEY='n4-practice-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function fresh(){return {plan:{},prog:{},wrongQ:[],wrongV:[],weak:[],vr:0,vt:0,qr:0,qt:0,forms:['te','ta'],exam:''}}
let S=Object.assign(fresh(),load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let TAB='today',VQ=null,VR=null,C=null,Q=null;

/* ========== 每日達標 ========== */
const VROUND=20,VPASS=18,QPASS=0.8;
const REQ_TXT={v:'動詞：一回合 20 題，答對 18 題以上',c:'卡片：這組全部翻完一輪',q:'測驗：一回合答對 8 成以上',w:'錯題本：重做一輪錯題'};
function todayIdx(){return DAYS.findIndex((_,i)=>!S.plan[i])}
function reqs(d){const r=[];if(d.f)r.push('v');if(d.g!==undefined&&d.g!==0)r.push('c');if(d.g!==undefined&&d.g!==13)r.push('q');if(d.wr)r.push('w');return r}
function credit(kind,cond){
  const i=todayIdx();if(i<0)return '';
  const d=DAYS[i];if(!reqs(d).includes(kind)||!cond(d))return '';
  const p=S.prog[i]||(S.prog[i]={});
  if(p[kind])return '';
  p[kind]=true;
  if(reqs(d).every(k=>p[k])){S.plan[i]=true;save();return 'Day '+(i+1)+' 全部完成！'+(i+1<DAYS.length?'明天繼續 Day '+(i+2)+'。':'四週計畫完成！')}
  save();return 'Day '+(i+1)+' 的「'+REQ_TXT[kind].split('：')[0]+'」達標了，回「今天」看還剩什麼。';
}

/* ========== 工具 ========== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pct(r,t){return t?Math.round(r/t*100)+'%':'—'}
const $app=document.getElementById('app');

/* ========== 動詞 ========== */
function startVerbRound(mode){
  let list=[];
  if(mode==='w')list=shuffle(S.wrongV.map(k=>{const [vi,f]=k.split('|');return {vi:+vi,f}})).slice(0,VROUND);
  else{let last=-1;for(let n=0;n<VROUND;n++){let vi;do{vi=Math.floor(Math.random()*VERBS.length)}while(vi===last);last=vi;list.push({vi,f:pick(S.forms)})}}
  VR={mode,list,i:0,right:0,msg:''};VQ=null;
}
function newVerb(){
  const it=VR.list[VR.i],v=VERBS[it.vi],f=it.f,c=conj(v,f);
  const opts=[c];
  for(const w of wrongs(v,f)){if(opts.length>=4)break;if(w&&!opts.includes(w))opts.push(w)}
  VQ={vi:it.vi,v,f,c,opts:shuffle(opts),ans:null};
}
function answerVerb(i){
  if(VQ.ans!==null)return;VQ.ans=i;S.vt++;
  const key=VQ.vi+'|'+VQ.f,w=S.wrongV.indexOf(key);
  if(VQ.opts[i]===VQ.c){S.vr++;VR.right++;if(w>=0)S.wrongV.splice(w,1)}
  else if(w<0)S.wrongV.push(key);
  save();render();
}
function nextVerb(){
  VR.i++;VQ=null;
  if(VR.i>=VR.list.length){
    if(VR.mode==='w')VR.msg=credit('w',()=>true);
    else VR.msg=credit('v',d=>VR.right>=VPASS&&d.f.every(f=>S.forms.includes(f)));
  }
  render();window.scrollTo(0,0);
}
function viewVerb(){
  if(!VR)startVerbRound('n');
  let h=`<div class="chips"><button class="chip ${VR.mode==='n'?'on':''}" data-act="vmode" data-m="n">一般練習</button><button class="chip ${VR.mode==='w'?'on':''}" data-act="vmode" data-m="w">錯的動詞（${S.wrongV.length}）</button></div>`;
  if(VR.mode==='n')h+='<div class="chips wrap">'+FORM_KEYS.map(k=>`<button class="chip ${S.forms.includes(k)?'on':''}" data-act="form" data-f="${k}">${FORM[k]}</button>`).join('')+'</div>';
  if(!VR.list.length)return h+'<div class="card muted">目前沒有錯的動詞，太好了！</div>';
  if(VR.i>=VR.list.length){
    const n=VR.list.length,pass=VR.mode==='w'||VR.right>=VPASS;
    h+=`<div class="card" style="text-align:center"><h2>這回合結束</h2><div class="big">${VR.right} / ${n}</div>`;
    h+=VR.mode==='w'?'<p class="muted">答對的已從錯題本移除。</p>':(pass?'<p class="muted">達標！答錯的動詞已收進錯題本。</p>':'<p class="muted">要答對 18 題才算達標，錯的已收進錯題本。先點「錯的動詞」練一輪，再來挑戰。</p>');
    if(VR.msg)h+='<div class="msg">'+esc(VR.msg)+'</div>';
    return h+`<button class="btn" data-act="vmode" data-m="${VR.mode}">再來一回合</button></div>`;
  }
  if(!VQ)newVerb();
  const {v,f,c,opts,ans}=VQ;
  h+='<div class="count">'+(VR.i+1)+' / '+VR.list.length+'　答對 '+VR.right+'</div>';
  h+='<div class="card"><div class="big">'+esc(v.k)+'</div><div class="reading">'+esc(v.r)+'</div>';
  h+='<div class="ask">→ <b>'+FORM[f]+'</b> 是？</div><div class="opts">';
  opts.forEach((o,i)=>{
    let cls='';if(ans!==null){if(o===c)cls='ok';else if(i===ans)cls='ng'}
    h+=`<button class="opt ${cls}" data-act="vans" data-i="${i}">${esc(o)}</button>`;
  });
  h+='</div>';
  if(ans!==null){
    const ok=opts[ans]===c;
    h+=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'答對了！':'正確答案：'+esc(c)}</b>${esc(rule(v,f))}</div>`;
    h+='<button class="btn" data-act="vnext">'+(VR.i+1>=VR.list.length?'看結果':'下一題')+'</button>';
  }
  h+='</div><p class="muted">一回合 20 題，答對 18 題算達標。答錯的動詞會收進錯題本。</p>';
  return h;
}

/* ========== 卡片 ========== */
function startCards(g){
  const deck=g==='w'?S.weak.slice():GROUPS[g-1].items.map((_,i)=>g+'-'+i);
  C={g,deck:shuffle(deck),i:0,flip:false};
}
function cardItem(k){const [g,i]=k.split('-').map(Number);return {g,it:GROUPS[g-1].items[i]}}
function markCard(weak){
  const k=C.deck[C.i];
  const idx=S.weak.indexOf(k);
  if(weak&&idx<0)S.weak.push(k);
  if(!weak&&idx>=0)S.weak.splice(idx,1);
  C.i++;C.flip=false;
  if(C.i>=C.deck.length)C.msg=C.g==='w'?credit('w',()=>true):credit('c',d=>d.g===C.g);
  save();render();
}
function groupChips(act,cur,extra){
  let h='<div class="chips">';
  (extra||[]).forEach(([v,l])=>h+=`<button class="chip ${String(cur)===String(v)?'on':''}" data-act="${act}" data-g="${v}">${l}</button>`);
  return h;
}
function viewCards(){
  if(!C)startCards(1);
  let h=groupChips('cg',C.g,[['w','不熟（'+S.weak.length+'）']]);
  GROUPS.forEach((G,i)=>h+=`<button class="chip ${String(C.g)===String(i+1)?'on':''}" data-act="cg" data-g="${i+1}">${i+1<13?(i+1)+'. ':''}${G.n}</button>`);
  h+='</div>';
  if(C.deck.length===0)return h+'<div class="card muted">這裡還沒有卡片。練習時按「不熟」的卡片會收集到這裡。</div>';
  if(C.i>=C.deck.length){
    return h+'<div class="card" style="text-align:center"><h2>這組看完了</h2><p class="muted">不熟的卡片已收進「不熟」清單。</p>'+(C.msg?'<div class="msg">'+esc(C.msg)+'</div>':'')+'<button class="btn" data-act="cg" data-g="'+C.g+'">再來一次</button></div>';
  }
  const {g,it}=cardItem(C.deck[C.i]);
  h+='<div class="count">'+(C.i+1)+' / '+C.deck.length+'　'+esc(GROUPS[g-1].n)+'</div>';
  h+='<div class="card flash" data-act="flip"><div class="pat">'+esc(it[0])+'</div>';
  if(C.flip)h+='<div class="mean">'+esc(it[1])+'</div><div class="ex">'+esc(it[2])+'</div>';
  else h+='<div class="hint">先想想意思，再點一下看答案</div>';
  h+='</div>';
  if(C.flip)h+='<div class="row2"><button class="btn ghost" data-act="weak">不熟</button><button class="btn" data-act="known">記得</button></div>';
  return h;
}

/* ========== 測驗 ========== */
function startQuiz(g){
  let ids;
  if(g==='w')ids=S.wrongQ.slice();
  else if(String(g)==='0')ids=QS.map((_,i)=>i);
  else ids=QS.map((q,i)=>q.g===Number(g)?i:-1).filter(i=>i>=0);
  ids=shuffle(ids).slice(0,g==='w'?20:10);
  Q={g:String(g),list:ids.map(id=>({id,order:shuffle([0,1,2,3])})),i:0,ans:null,right:0};
}
function answerQuiz(i){
  if(Q.ans!==null)return;Q.ans=i;
  const it=Q.list[Q.i],q=QS[it.id],ok=it.order[i]===q.a;
  S.qt++;
  const w=S.wrongQ.indexOf(it.id);
  if(ok){S.qr++;Q.right++;if(Q.g==='w'&&w>=0)S.wrongQ.splice(w,1)}
  else if(w<0)S.wrongQ.push(it.id);
  save();render();
}
function viewQuiz(){
  if(!Q)startQuiz(0);
  let h=groupChips('qg',Q.g,[['0','全部隨機'],['w','錯題（'+S.wrongQ.length+'）']]);
  GROUPS.slice(0,12).forEach((G,i)=>h+=`<button class="chip ${Q.g===String(i+1)?'on':''}" data-act="qg" data-g="${i+1}">${i+1}. ${G.n}</button>`);
  h+='</div>';
  if(Q.list.length===0){
    let m='';if(Q.g==='w'&&!S.wrongV.length)m=credit('w',()=>true);
    return h+'<div class="card muted">目前沒有文法錯題。'+(S.wrongV.length?'還有 '+S.wrongV.length+' 個錯的動詞，到「動詞」→「錯的動詞」練。':'太好了！')+(m?'<div class="msg">'+esc(m)+'</div>':'')+'</div>';
  }
  if(Q.i>=Q.list.length){
    const need=Math.ceil(Q.list.length*QPASS),pass=Q.g==='w'||Q.right>=need;
    const note=Q.g==='w'?'答對的已從錯題本移除。':(pass?'達標！答錯的題目已收進錯題本。':'要答對 '+need+' 題才算達標，再來一回合。');
    return h+`<div class="card" style="text-align:center"><h2>這回合結束</h2><div class="big">${Q.right} / ${Q.list.length}</div><p class="muted">${note}</p>${Q.msg?'<div class="msg">'+esc(Q.msg)+'</div>':''}<button class="btn" data-act="qg" data-g="${Q.g}">再來一回合</button></div>`;
  }
  const it=Q.list[Q.i],q=QS[it.id];
  h+='<div class="count">'+(Q.i+1)+' / '+Q.list.length+'　'+esc(GROUPS[q.g-1].n)+'</div>';
  h+='<div class="card"><div class="qtext">'+esc(q.q)+'</div><div class="qopts">';
  it.order.forEach((oi,i)=>{
    let cls='';if(Q.ans!==null){if(oi===q.a)cls='ok';else if(i===Q.ans)cls='ng'}
    h+=`<button class="opt ${cls}" data-act="qans" data-i="${i}">${esc(q.o[oi])}</button>`;
  });
  h+='</div>';
  if(Q.ans!==null){
    const ok=it.order[Q.ans]===q.a;
    h+=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'答對了！':'正確答案：'+esc(q.o[q.a])}</b>${esc(q.e)}</div><button class="btn" data-act="qnext">${Q.i+1>=Q.list.length?'看結果':'下一題'}</button>`;
  }
  return h+'</div>';
}

/* ========== 錯題本 ========== */
function viewWrong(){
  let h='<h2>文法錯題（'+S.wrongQ.length+'）</h2>';
  h+='<div class="card">';
  if(!S.wrongQ.length)h+='<p class="muted" style="margin:0">目前沒有錯題。</p>';
  else{
    S.wrongQ.forEach(id=>{const q=QS[id];h+=`<div class="wq"><div class="s">${esc(q.q)}</div><div class="a">答案：<span>${esc(q.o[q.a])}</span>　${esc(q.e)}</div></div>`});
    h+='<button class="btn" data-act="gowrong">重做錯題（答對就移除）</button>';
  }
  h+='</div><h2>錯的動詞（'+S.wrongV.length+'）</h2><div class="card">';
  if(!S.wrongV.length)h+='<p class="muted" style="margin:0">動詞練習答錯的，會收進這裡。</p>';
  else{
    S.wrongV.forEach(k=>{const [vi,f]=k.split('|'),v=VERBS[+vi];h+=`<div class="wq"><div class="s">${esc(v.k)}（${esc(v.r)}）→ ${FORM[f]}</div><div class="a">答案：<span>${esc(conj(v,f))}</span></div></div>`});
    h+='<button class="btn" data-act="vmodego">重練錯的動詞（答對就移除）</button>';
  }
  h+='</div><h2>不熟的文法卡（'+S.weak.length+'）</h2><div class="card">';
  if(!S.weak.length)h+='<p class="muted" style="margin:0">練卡片時按「不熟」，就會收進這裡。</p>';
  else{
    S.weak.forEach(k=>{const {it}=cardItem(k);h+=`<div class="wq"><div class="s">${esc(it[0])}</div><div class="a">${esc(it[1])}</div></div>`});
    h+='<button class="btn" data-act="gocards" data-g="w">複習不熟卡片</button>';
  }
  h+='</div><button class="link" data-act="reset">清除所有紀錄</button>';
  return h;
}

/* ========== 今天 ========== */
function dayActs(d,i){
  let h='';
  if(d.f)h+=`<button class="mini" data-act="goverb" data-d="${i}">動詞</button>`;
  if(d.g!==undefined){
    if(d.g===13)h+=`<button class="mini" data-act="gocards" data-g="13">卡片</button>`;
    else if(d.g===0)h+=`<button class="mini" data-act="goquiz" data-g="0">測驗</button>`;
    else h+=`<button class="mini" data-act="gocards" data-g="${d.g}">卡片</button><button class="mini" data-act="goquiz" data-g="${d.g}">測驗</button>`;
  }
  if(d.wr)h+=`<button class="mini" data-act="gowrong">錯題</button>`;
  return h;
}
function viewToday(){
  const done=DAYS.filter((_,i)=>S.plan[i]).length;
  const next=DAYS.findIndex((_,i)=>!S.plan[i]);
  let h='';
  if(next>=0){
    const d=DAYS[next];
    h+=`<div class="card today-box"><div class="muted">今天的任務・Day ${next+1}</div><div class="t">${esc(d.t)}</div>${reqs(d).map(k=>{const ok=(S.prog[next]||{})[k];return `<div class="req ${ok?'ok':''}">${ok?'✓':'○'} ${REQ_TXT[k]}</div>`}).join('')}<p class="muted" style="margin:8px 0 10px">每項達標會自動打勾，全部完成就換下一天。${d.wr?'書上的模擬題做完、錯題重做一輪後算完成。':''}</p><div class="acts" style="justify-content:flex-start">${dayActs(d,next)}</div></div>`;
  }else h+='<div class="card today-box"><div class="t">四週計畫全部完成！</div><p class="muted" style="margin:0">接下來就多刷錯題本和易混淆對照。</p></div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;font-size:14px"><span>計畫進度</span><span>'+done+' / '+DAYS.length+' 天</span></div><div class="bar"><i style="width:'+(done/DAYS.length*100)+'%"></i></div>';
  h+='<div class="stats"><div class="stat"><b>'+pct(S.vr,S.vt)+'</b>動詞正確率</div><div class="stat"><b>'+pct(S.qr,S.qt)+'</b>文法正確率</div><div class="stat"><b>'+(S.wrongQ.length+S.wrongV.length)+'</b>錯題</div></div>';
  let cd='';
  if(S.exam){const t=new Date();t.setHours(0,0,0,0);const e=new Date(S.exam+'T00:00:00');const n=Math.round((e-t)/864e5);cd=n>0?'還有 '+n+' 天':(n===0?'就是今天，加油！':'考試已結束');}
  h+='<div class="exam"><span>考試日期 <input type="date" id="exam" value="'+esc(S.exam)+'"></span><span class="cd">'+cd+'</span></div></div>';
  PLAN.forEach(w=>{
    h+='<div class="week"><h3>'+w.w+'</h3>';
    w.d.forEach(d=>{
      const i=DAYS.indexOf(d),dn=!!S.plan[i];
      h+=`<div class="day ${dn?'done':''} ${i===next?'today':''}"><input type="checkbox" data-day="${i}" ${dn?'checked':''} aria-label="完成 Day ${i+1}"><div class="t"><span class="d">Day ${i+1}</span>${esc(d.t)}</div><div class="acts">${dayActs(d,i)}</div></div>`;
    });
    h+='</div>';
  });
  return h;
}

/* ========== 主框架 ========== */
const TABS=[['today','今','今天'],['verb','動','動詞'],['cards','覚','卡片'],['quiz','試','測驗'],['wrong','錯','錯題']];
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,ic,l])=>`<button class="${TAB===k?'on':''}" data-act="tab" data-t="${k}"><span class="ic">${ic}</span>${l}</button>`).join('');
  document.getElementById('hmeta').textContent='錯題 '+(S.wrongQ.length+S.wrongV.length)+'・不熟 '+S.weak.length;
  $app.innerHTML=TAB==='verb'?viewVerb():TAB==='cards'?viewCards():TAB==='quiz'?viewQuiz():TAB==='wrong'?viewWrong():viewToday();
}
function go(t){TAB=t;render();window.scrollTo(0,0)}
const H={
  tab:b=>go(b.dataset.t),
  form:b=>{const f=b.dataset.f,i=S.forms.indexOf(f);if(i>=0){if(S.forms.length>1)S.forms.splice(i,1)}else S.forms.push(f);save();startVerbRound('n');render()},
  vans:b=>answerVerb(+b.dataset.i),
  vnext:()=>nextVerb(),
  vmode:b=>{startVerbRound(b.dataset.m);render()},
  vmodego:()=>{startVerbRound('w');go('verb')},
  cg:b=>{startCards(b.dataset.g==='w'?'w':+b.dataset.g);render()},
  flip:()=>{C.flip=!C.flip;render()},
  weak:()=>markCard(true),
  known:()=>markCard(false),
  qg:b=>{startQuiz(b.dataset.g);render()},
  qans:b=>answerQuiz(+b.dataset.i),
  qnext:()=>{
    Q.i++;Q.ans=null;
    if(Q.i>=Q.list.length)Q.msg=Q.g==='w'?credit('w',()=>true):credit('q',d=>String(d.g)===Q.g&&Q.right>=Math.ceil(Q.list.length*QPASS));
    render();window.scrollTo(0,0)},
  goverb:b=>{S.forms=DAYS[+b.dataset.d].f.slice();save();startVerbRound('n');go('verb')},
  gocards:b=>{startCards(b.dataset.g==='w'?'w':+b.dataset.g);go('cards')},
  goquiz:b=>{startQuiz(b.dataset.g);go('quiz')},
  gowrong:()=>{if(!S.wrongQ.length&&S.wrongV.length){startVerbRound('w');go('verb')}else{startQuiz('w');go('quiz')}},
  reset:()=>{if(confirm('確定要清除所有練習紀錄、錯題和進度嗎？')){S=fresh();save();VQ=VR=C=Q=null;render()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&H[b.dataset.act])H[b.dataset.act](b)});
document.addEventListener('change',e=>{
  if(e.target.dataset.day!==undefined){S.plan[e.target.dataset.day]=e.target.checked;save();render()}
  else if(e.target.id==='exam'){S.exam=e.target.value;save();render()}
});
render();
</script>
</body>
</html>
